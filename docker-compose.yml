# Local development / single-machine setup.
#   cp .env.example .env   # add your ANTHROPIC_API_KEY (optional) and Google OAuth credentials (optional)
#   docker compose up --build
# Dashboard: http://localhost:3000   API docs: http://localhost:8000/docs
# Free local AI: the Ollama app on this computer works as is (the app reaches it at host.docker.internal),
# or run Ollama in Docker too: COMPOSE_PROFILES=ollama + OLLAMA_BASE_URL=http://ollama:11434 in .env, then
#   docker compose exec ollama ollama pull qwen3.5:4b      (or press "Download model" in Settings)
name: hireflow

x-backend: &backend
  build:
    context: .
    dockerfile: backend/Dockerfile
  init: true  # reaps Chromium child processes
  image: hireflow-backend:local
  env_file:
    - path: .env
      required: false
  environment: &backend-env
    DATABASE_URL: postgresql+psycopg://hireflow:hireflow@postgres:5432/hireflow
    REDIS_URL: redis://redis:6379/0
    LOCAL_STORAGE_PATH: /data/storage
    FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
    PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:8000}
    CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
    # The public demo (./start.sh --docker --demo, or DEMO_MODE=true in .env). The worker's browser reaches
    # the bundled demo careers site through the api container, not localhost.
    DEMO_MODE: ${DEMO_MODE:-false}
    DEMO_SITE_URL: ${DEMO_SITE_URL:-http://api:8000/api/v1/demo-careers}
  volumes:
    - storage:/data
  extra_hosts:
    # lets the agent reach the demo site and an Ollama app on your machine (Linux too)
    - "host.docker.internal:host-gateway"
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  restart: unless-stopped

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: hireflow
      POSTGRES_PASSWORD: hireflow
      POSTGRES_DB: hireflow
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hireflow -d hireflow"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    <<: *backend
    command: ["api"]
    ports:
      - "8000:8000"

  worker:
    <<: *backend
    command: ["worker"]
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.worker.celery_app inspect ping -d celery@$$HOSTNAME --timeout 10"]
      interval: 60s
      timeout: 30s
      start_period: 30s
    shm_size: "1gb"  # Chromium needs shared memory
    depends_on:
      api:
        condition: service_healthy

  beat:
    <<: *backend
    command: ["beat"]
    healthcheck:
      disable: true
    depends_on:
      api:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        BACKEND_URL: http://api:8000
    environment:
      BACKEND_URL: http://api:8000
    image: hireflow-frontend:local
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  # Free local AI model server, only with the "ollama" profile (COMPOSE_PROFILES=ollama in .env, or
  # `docker compose --profile ollama up -d`). The app reaches it at http://ollama:11434. Its API has no
  # authentication, so the port isn't published; add ports: ["127.0.0.1:11434:11434"] to use it from your machine.
  ollama:
    image: ollama/ollama
    profiles: ["ollama"]
    environment:
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-30m}
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_CONTEXT_LENGTH: ${OLLAMA_NUM_CTX:-8192}
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 10s
      retries: 20
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  storage:
  ollama-models:
