line-length = 150
target-version = "py311"
extend-exclude = ["alembic/versions"]

[lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "BLE", "N", "RUF"]
ignore = [
  "S101",   # assert in tests
  "S311",   # random for jitter/emulation is not crypto
  "B008",   # FastAPI Depends/File in defaults
  "RUF001", "RUF002", "RUF003",  # unicode punctuation in strings/comments is intentional
  "RUF012",
  "S603", "S607",
  "UP040",
  "UP042",  # keep (str, Enum) for broad compatibility
  "N818",   # exception names are domain terms
  "S110", "S112",  # best-effort browser automation intentionally swallows some errors
]

[lint.per-file-ignores]
"tests/*" = ["S", "E402", "BLE001", "N802", "E501"]
"scripts/*" = ["S", "E402"]
"alembic/env.py" = ["E402"]
# Embedded JavaScript / long regex literals
"app/automation/captcha.py" = ["E501"]
"app/submitters/form_engine.py" = ["E501"]
"app/services/question_answerer.py" = ["E501"]

[lint.isort]
known-first-party = ["app", "tests"]
